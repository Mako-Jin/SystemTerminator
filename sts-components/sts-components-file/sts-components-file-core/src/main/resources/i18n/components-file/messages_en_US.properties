# ---------- General Errors (000-099) ----------
common.success=Operation successful
common.failed=Operation failed
common.param.invalid=Invalid parameter
common.param.missing=Missing required parameter

# ---------- File Errors (100-199) ----------
file.not.found=File not found
file.empty=File is empty
file.too.large=File size exceeds limit, maximum {0}MB
file.size.invalid=Invalid file size
file.name.empty=File name is empty
file.name.invalid=Invalid file name
file.hash.mismatch=File hash mismatch, possible tampering
file.extension.not.allowed=File extension not allowed: {0}
file.already.exists=File already exists, fileId: {0}, fileName: {1}

# ---------- Upload Errors (200-299) ----------
upload.failed=Upload failed
upload.interrupted=Upload interrupted
upload.chunk.missing=Chunk {0} missing
upload.chunk.md5.mismatch=Chunk MD5 verification failed
upload.session.not.found=Upload session not found: {0}
upload.session.expired=Upload session expired
upload.session.completed=Upload session completed

# ---------- Storage Errors (300-399) ----------
storage.type.not.supported=Storage type not supported: {0}
storage.node.not.found=Storage node not found
storage.node.unavailable=Storage node unavailable
storage.capacity.exceeded=Storage capacity exceeded

# ---------- Version Errors (400-499) ----------
version.create.denied=Permission denied to create version
version.not.found=Version not found: {0}
version.delete.denied=Permission denied to delete version
version.tag.exist=Tag already exists

# ---------- Permission Errors (500-599) ----------
overwrite.denied=Permission denied to overwrite this file
unauthorized=Unauthorized
forbidden=Forbidden

# ---------- System Errors (900-999) ----------
system.error=System error
timeout=Request timeout

# ---------- Success Messages ----------
upload.success=Upload successful
upload.duplicate.reuse=Instant upload successful (reused existing file)
upload.version.created=Created new version v{0}
upload.overwrite.success=File overwritten successfully
upload.resume.success=Upload resumed successfully
upload.cancel.success=Upload canceled
